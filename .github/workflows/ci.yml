name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  titulo:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Conventional Commits
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$TITULO" =~ ^(feat|fix|security|chore|docs|refactor|test|ci|perf|build|revert|release)(\([a-z0-9._/áéíóúñ-]+\))?!?:\ .+ ]]; then
            echo "::error::El título del PR debe ser 'tipo(alcance): descripción'. Llegó: $TITULO"; exit 1
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: js/ es JavaScript válido
        run: for f in js/*.js sw.js; do node --check "$f" || exit 1; done
