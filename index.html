<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Policía Militar · Reportes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b1216;--panel:#101c21;--line:#c9a43a;--gold:#f0c24d;--text:#f3f3f3;--muted:#9aa7ad;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Roboto Condensed",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
  header{padding:36px 20px 24px;text-align:center;border-bottom:2px solid var(--line);
    background:linear-gradient(180deg,#132228 0%,var(--bg) 100%)}
  header .unidad{color:var(--gold);letter-spacing:4px;font-size:13px;font-weight:700;text-transform:uppercase;margin:0 0 6px}
  header h1{margin:0;font-size:clamp(30px,6vw,52px);font-style:italic;font-weight:700;text-transform:uppercase;letter-spacing:1px;line-height:1}
  header h1 small{display:block;font-size:.42em;font-style:normal;color:var(--muted);letter-spacing:5px;margin-top:8px}
  header .lema{margin:16px 0 0;color:var(--muted);font-size:13px;letter-spacing:3px;text-transform:uppercase}
  header .lema b{color:var(--gold)}
  main{flex:1;max-width:1100px;width:100%;margin:0 auto;padding:28px 20px 40px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .card{display:block;background:var(--panel);border:1px solid #2b3a40;border-radius:10px;padding:20px;color:inherit;text-decoration:none;
    position:relative;transition:border-color .15s,transform .15s}
  .card:hover{border-color:var(--gold);transform:translateY(-2px)}
  .card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;background:var(--line);border-radius:0 3px 3px 0}
  .card .ico{font-size:28px;line-height:1;margin-bottom:10px}
  .card h2{margin:0 0 6px;font-size:21px;text-transform:uppercase;font-style:italic;color:var(--gold)}
  .card p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
  .card .meta{margin-top:14px;display:flex;justify-content:space-between;font-size:12px;color:#6b7a81;text-transform:uppercase;letter-spacing:1px}
  .card .meta .tag{color:#7fd38a}
  .card.proximo{opacity:.55;pointer-events:none}
  .card.proximo .meta .tag{color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:40px}
  footer{text-align:center;padding:18px;color:#5a6a71;font-size:12px;letter-spacing:2px;text-transform:uppercase;border-top:1px solid #1c272c}
</style>
</head>
<body>
<header>
  <p class="unidad">Army de Wasco</p>
  <h1>Policía Militar<small>Reportes</small></h1>
  <p class="lema">¡Honor <b>★</b> Lealtad <b>★</b> Disciplina!</p>
</header>
<main>
  <div class="grid" id="lista"></div>
</main>
<footer>Un equipo · Una misión · Un solo Army</footer>

<script type="module">
  import { requerir, barraUsuario, puedeFormulario, sb, esc } from './auth.js';
  const yo = await requerir(); barraUsuario(yo);
  const fmt = iso => { if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}-${m}-${y}`; };
  const el = document.getElementById('lista');
  const { data: formularios, error } = await sb.from('formularios').select('*').eq('activo', true).order('orden');
  if(error){ el.innerHTML = `<p class="empty">No se pudo cargar la lista de reportes: ${esc(error.message)}</p>`; }
  else {
    const visibles = (formularios||[]).filter(f => puedeFormulario(yo, f.id));
    if(!visibles.length) el.innerHTML = '<p class="empty">No tienes formularios asignados. Pide acceso al administrador.</p>';
    else el.innerHTML = visibles.map(r => `<a class="card" href="${esc(r.ruta)}">
          <div class="ico">${esc(r.icono || '📋')}</div>
          <h2>${esc(r.titulo)}</h2>
          <p>${esc(r.descripcion || '')}</p>
          <div class="meta"><span>${r.creado_en ? 'Desde ' + fmt(r.creado_en.slice(0,10)) : ''}</span><span class="tag">Disponible</span></div>
        </a>`).join('');
  }
</script>
</body>
</html>
